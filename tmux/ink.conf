# Ink: matches colors/ink.lua. No plugins or special font glyphs required.
set -g status on
set -g status-position bottom
set -g status-interval 15
set -g status-style 'bg=#202020,fg=#999999'
set -g status-justify left
set -g status-left-length 28
set -g status-right-length 55
set -g status-left '#[bg=#393939,fg=#eeeeee,bold] #S #[default] '
set -g status-right '#[fg=#aac9dd]#{?client_prefix, PREFIX ,}#{?pane_in_mode, COPY ,}#[fg=#707070]#{?window_zoomed_flag, ZOOM | ,}#[fg=#999999]%a %d %b #[fg=#eeeeee]%H:%M '

setw -g window-status-separator ' '
setw -g window-status-format ' #I:#W#{?window_bell_flag, !,} '
setw -g window-status-style 'bg=#202020,fg=#999999'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, +,} '
setw -g window-status-current-style 'bg=#393939,fg=#ffffff,bold'
setw -g window-status-activity-style 'fg=#aac9dd,bg=#202020'
setw -g window-status-bell-style 'fg=#d5b99e,bg=#202020,bold'

set -g pane-border-style 'fg=#393939'
set -g pane-active-border-style 'fg=#999999'
set -g pane-border-lines single
set -g pane-border-status off
set -g display-panes-colour '#707070'
set -g display-panes-active-colour '#eeeeee'
set -g message-style 'bg=#393939,fg=#eeeeee'
set -g message-command-style 'bg=#393939,fg=#eeeeee'
setw -g mode-style 'bg=#393939,fg=#ffffff'
set -g clock-mode-colour '#aac9dd'
set -g clock-mode-style 24
set -g menu-style 'bg=#202020,fg=#eeeeee'
set -g menu-selected-style 'bg=#393939,fg=#ffffff,bold'
set -g menu-border-style 'fg=#707070'
set -g popup-style 'bg=#141414,fg=#eeeeee'
set -g popup-border-style 'fg=#707070'

# Advertise RGB support for common terminal types without changing TERM.
set -as terminal-features ',xterm*:RGB,alacritty*:RGB,foot*:RGB,kitty*:RGB'
